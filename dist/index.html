    <!-- Loader boot: exposes window.__showcaseLoader (hide/remove/fail + the
         animation start time and loop length, so the app can hold the loader for
         at least one full wheel loop), kicks off the hero frame downloads, and
         arms a stall watchdog that shows the failure message if nothing loads for
         30s before the app starts (bundle failed to execute, dead network, …).
         Frame path/name/count
         mirror FRAMES_PATH + getFrameName in src/app/Hero.jsx and
         FRAME_SEQUENCE in src/constants.js (start 0, end 82, MIN_FRAMES_FOR_START 15). -->
    <script>
      (function () {
        var el = document.getElementById('showcase-loader');
        var L = (window.__showcaseLoader = {
          start: performance.now(),
          loopMs: 3200,
          removed: false,
          started: false, // main.jsx has run and rendered the app → Hero owns the loader
          hide: function () {
            if (el) el.classList.add('is-hiding');
          },
          remove: function () {
            L.removed = true;
            if (el && el.parentNode) el.parentNode.removeChild(el);
          },
          appStarted: function () {
            L.started = true;
            // Self-heal: a transient pre-start error (dev-server hiccup) may have
            // flipped the failure state — the app is running, so put the wheel back.
            if (el && el.classList.contains('is-failed')) {
              el.classList.remove('is-failed');
              el.setAttribute('role', 'status');
              el.setAttribute('aria-label', 'Loading Tonhaute Labs showcase');
            }
          },
          // Only ever fails BEFORE the app starts — once it has, Hero.jsx lifts the
          // loader itself (with its own 15s safety). The short grace absorbs the
          // dev server's transient module errors (Vite answers 504 "outdated
          // optimize dep" mid-graph, then reloads the page) without flashing the
          // message; a real bundle failure still shows it ~1.5s later.
          fail: function (reason) {
            if (!el || L.removed || L.started) return;
            window.setTimeout(function () {
              if (!el || L.removed || L.started) return;
              console.warn('[showcase loader] failed: ' + (reason || 'unknown'));
              el.classList.remove('is-hiding');
              el.classList.add('is-failed');
              el.setAttribute('role', 'alert');
              el.removeAttribute('aria-label');
            }, 1500);
          },
        });
        if (window.__showcaseBundleFailed) L.fail(window.__showcaseBundleFailed);
        // Hero frames (public/frames, stable names): first frame, last frame, then
        // the MIN_FRAMES_FOR_START window — the same order useFrameSequence
        // requests them, so its requests hit the HTTP cache. Low fetch priority:
        // nothing can use them until the app has mounted, so the bundle wins the
        // bandwidth race (matters on slow links and the unbundled dev server).
        var frames = [0, 82];
        for (var i = 1; i < 15; i++) frames.push(i);
        frames.forEach(function (n) {
          var img = new Image();
          img.fetchPriority = 'low';
          img.src = '/frames/Scroll%20Vid%202-' + String(n).padStart(3, '0') + '.webp';
        });
        // Watchdog: the app never started (bundle downloaded but threw before
        // render, hung network, …). Measures STALL, not elapsed time: the timer
        // re-arms whenever any resource finishes loading, so a slow-but-moving
        // load (throttled network, cold dev server streaming hundreds of modules)
        // is never mistaken for a failure. It fires only after 30s with nothing
        // arriving and the app still not started.
        var STALL_MS = 30000;
        var stallTimer;
        var arm = function () {
          window.clearTimeout(stallTimer);
          stallTimer = window.setTimeout(function () {
            if (!L.removed && !L.started) L.fail('app did not start and no resource loaded for 30s');
          }, STALL_MS);
        };
        arm();
        if (window.PerformanceObserver) {
          try {
            var po = new PerformanceObserver(function () {
              if (L.started || L.removed) po.disconnect();
              else arm();
            });
            po.observe({ type: 'resource', buffered: false });
          } catch (e) {
            /* no resource timing → plain 30s timer above */
          }
        }
      })();
    </script>
